<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Comercial — DEV</title>
  <link rel="icon" href="../assets/icone-amo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dev.css" />
</head>
<body>
  <div id="telaLogin" class="tela-login">
    <form id="formLogin">
      <img src="../assets/logo-amo.png" alt="AMO" class="tela-login__logo" />
      <h1>Acesso DEV</h1>
      <input type="text" id="campoUsuario" placeholder="Usuário" required />
      <input type="password" id="campoSenha" placeholder="Senha" required />
      <button type="submit">Entrar</button>
      <p id="mensagemLogin" class="mensagem-erro"></p>
    </form>
  </div>

  <div id="telaConfig" class="tela-config" hidden>
    <aside class="painel-controles">
      <h1>Configuração do rodízio</h1>
      <div class="campo">
        <label>Tema</label>
        <select id="campoTema">
          <option value="escuro">Escuro</option>
          <option value="claro">Claro</option>
          <option value="amo">AMO</option>
        </select>
      </div>
      <div class="campo">
        <label>Qtd. na lista (além do pódio)</label>
        <input type="number" id="campoQtdLista" min="0" />
      </div>
      <div class="campo">
        <label>Velocidade da rolagem (pixels por segundo)</label>
        <input type="number" id="campoVelocidadeScroll" min="1" />
      </div>
      <div class="campo">
        <label>Duração da transição entre períodos (segundos, 0 = sem transição)</label>
        <input type="number" id="campoDuracaoFade" min="0" step="0.1" />
      </div>
      <div class="campo">
        <label>Fixar uma tela (opcional)</label>
        <select id="campoFixado"></select>
      </div>
      <div class="campo">
        <label>Métricas exibidas</label>
        <div class="campo-metricas">
          <label class="campo-metricas__item"><input type="checkbox" id="metricaAproveitamento" /> Aproveitamento (%)</label>
          <label class="campo-metricas__item"><input type="checkbox" id="metricaVendasImediato" /> Vendas Imediato</label>
          <label class="campo-metricas__item"><input type="checkbox" id="metricaContratos" /> Contratos</label>
          <label class="campo-metricas__item"><input type="checkbox" id="metricaExtra1" /> <input type="text" id="campoRotuloExtra1" placeholder="Nome da métrica extra 1" class="campo-metricas__rotulo" /></label>
          <label class="campo-metricas__item"><input type="checkbox" id="metricaExtra2" /> <input type="text" id="campoRotuloExtra2" placeholder="Nome da métrica extra 2" class="campo-metricas__rotulo" /></label>
        </div>
      </div>
      <div id="listaSlides"></div>
      <button id="botaoSalvar">Salvar configuração</button>
      <p id="mensagemSalvar" class="mensagem-status"></p>
    </aside>
    <main class="preview">
      <h2>Preview ao vivo (o que está passando nas TVs)</h2>
      <iframe src="../tv/tv.html" title="Preview da TV"></iframe>
    </main>
  </div>

  <script src="../shared/percent.js"></script>
  <script src="../shared/drive.js"></script>
  <script src="../shared/ranking.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/rotation.js"></script>
  <script src="../shared/apiConfig.js"></script>
  <script src="dev.js"></script>
</body>
</html>
