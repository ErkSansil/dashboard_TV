<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Comercial — DEV</title>
  <link rel="icon" href="../assets/icone-amo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dev.css" />
</head>
<body>
  <div id="telaLogin" class="tela-login">
    <form id="formLogin">
      <img src="../assets/logo-amo.png" alt="AMO" class="tela-login__logo" />
      <h1>Acesso DEV</h1>
      <input type="text" id="campoUsuario" placeholder="Usuário" required />
      <input type="password" id="campoSenha" placeholder="Senha" required />
      <button type="submit">Entrar</button>
      <p id="mensagemLogin" class="mensagem-erro"></p>
    </form>
  </div>

  <div id="telaConfig" class="tela-config" hidden>
    <aside class="painel-controles">
      <div class="painel-controles__cabecalho">
        <h1>Configuração do rodízio</h1>
        <button type="button" id="botaoPadrao" class="botao-padrao">Voltar ao padrão</button>
      </div>
      <div class="campo">
        <label>Tema de fundo</label>
        <select id="campoTema">
          <option value="escuro">Escuro (neutro, sem animação)</option>
          <option value="claro">Claro</option>
          <option value="amo">AMO (rosa e azul)</option>
          <option value="aurora">Aurora (verde e turquesa)</option>
          <option value="sunset">Pôr do Sol (laranja e rosa)</option>
          <option value="oceano">Oceano (azul e ciano)</option>
          <option value="platina">Platina (prata, premium)</option>
          <option value="fogo">Fogo (vermelho e laranja)</option>
          <option value="meianoite">Meia-noite (azul escuro, sutil)</option>
        </select>
      </div>
      <div class="campo">
        <label class="campo-metricas__item"><input type="checkbox" id="campoFundoAnimado" /> Fundo se mexendo (animado)</label>
      </div>
      <div class="campo">
        <label>Desfoque do fundo (px, 0 = nítido/definido)</label>
        <input type="number" id="campoFundoBlur" min="0" step="1" />
      </div>
      <div class="campo">
        <label>Estilo do fundo</label>
        <select id="campoFundoBrilho">
          <option value="fosco">Fosco (suave)</option>
          <option value="brilhante">Brilhante (mais vívido)</option>
        </select>
      </div>
      <div class="campo">
        <label>Qtd. na lista (além do pódio)</label>
        <input type="number" id="campoQtdLista" min="0" />
      </div>
      <div class="campo">
        <label>Velocidade da rolagem (pixels por segundo)</label>
        <input type="number" id="campoVelocidadeScroll" min="1" />
      </div>
      <div class="campo">
        <label>Duração da transição entre períodos (segundos, 0 = sem transição)</label>
        <input type="number" id="campoDuracaoFade" min="0" step="0.1" />
      </div>
      <div class="campo">
        <label>Tamanho da fonte da lista (%, 100 = padrão)</label>
        <input type="number" id="campoEscalaLista" min="1" />
      </div>
      <div class="campo">
        <label>Altura do pódio (%, menor = mais espaço pra lista abaixo)</label>
        <input type="number" id="campoAlturaPodio" min="1" max="99" />
      </div>
      <div class="campo">
        <label>Fixar uma tela (opcional)</label>
        <select id="campoFixado"></select>
      </div>
      <div class="campo">
        <label>Fixar posições no topo da lista até a posição (0 = nenhuma fixa)</label>
        <input type="number" id="campoFixarAtePosicao" min="0" step="1" />
        <p class="mensagem-status">Fixa do 4° colocado até a posição informada, sem rolar com os outros. Ex: 5 fixa 4° e 5°; 7 fixa do 4° ao 7°.</p>
      </div>
      <div class="campo">
        <label>Nomes para não aparecer no ranking (um por linha)</label>
        <textarea id="campoNomesExcluidos" rows="4" placeholder="Ex: Miranda&#10;Não enviar Fila"></textarea>
      </div>
      <div class="campo">
        <label>Métricas exibidas</label>
        <div class="campo-metricas">
          <label class="campo-metricas__item"><input type="checkbox" id="metricaAproveitamento" /> Aproveitamento (%)</label>
          <label class="campo-metricas__item"><input type="checkbox" id="metricaVendasImediato" /> Vendas Imediato</label>
          <label class="campo-metricas__item"><input type="checkbox" id="metricaContratos" /> Contratos</label>
          <label class="campo-metricas__item"><input type="checkbox" id="metricaExtra1" /> <input type="text" id="campoRotuloExtra1" placeholder="Nome da métrica extra 1" class="campo-metricas__rotulo" /></label>
          <label class="campo-metricas__item"><input type="checkbox" id="metricaExtra2" /> <input type="text" id="campoRotuloExtra2" placeholder="Nome da métrica extra 2" class="campo-metricas__rotulo" /></label>
        </div>
      </div>
      <div id="listaSlides"></div>
      <div class="barra-salvar" id="barraSalvar" hidden>
        <span class="barra-salvar__aviso">Alterações não salvas</span>
        <div class="barra-salvar__botoes">
          <button type="button" id="botaoDescartar" class="botao-secundario">Descartar</button>
          <button type="button" id="botaoSalvar">Salvar alterações</button>
        </div>
        <p id="mensagemSalvar" class="mensagem-status"></p>
      </div>
    </aside>
    <main class="preview">
      <h2>Preview ao vivo (o que está passando nas TVs)</h2>
      <iframe src="../tv/tv.html" title="Preview da TV"></iframe>
    </main>
  </div>

  <script src="../shared/percent.js"></script>
  <script src="../shared/drive.js"></script>
  <script src="../shared/ranking.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/rotation.js"></script>
  <script src="../shared/apiConfig.js"></script>
  <script src="dev.js"></script>
</body>
</html>
